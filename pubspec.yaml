name: paypaw
description: "PayPaw - track bills, subscriptions, debts, and recurring payments in one place."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # State management and dependency injection.
  # riverpod_annotation pairs with the riverpod_generator dev dependency.
  flutter_riverpod: ^3.4.2
  riverpod_annotation: ^4.0.6

  # Declarative routing, including deep links for notification taps.
  go_router: ^17.5.0

  # Backend: Postgres, Auth, Storage and Edge Functions.
  supabase_flutter: ^2.17.2

  # Local storage. shared_preferences holds non-sensitive settings;
  # flutter_secure_storage holds tokens and the app lock PIN.
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.0.0

  # Bill reminders. timezone is required for scheduling notifications at a
  # correct local time across DST and travel.
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  # Names the device's IANA zone so the timezone package can be pointed at it.
  # Without this its local zone stays UTC, and every reminder in Manila would
  # fire eight hours off.
  flutter_timezone: ^5.1.0

  # Receipt attachments: image_picker for camera/gallery, file_picker for PDFs.
  image_picker: ^1.2.3
  file_picker: ^12.0.0

  # Inter, the typeface used by the reference design. Fetched at runtime and
  # cached; see docs/design_system.md for the note on bundling it before
  # release.
  google_fonts: ^8.2.1

  # Spending analytics charts.
  fl_chart: ^1.2.0

  # Currency and date formatting (PHP amounts, due dates).
  intl: ^0.20.3

  # Annotations only, and pure Dart. Lets the domain layer use @immutable without
  # importing package:flutter, which it must not do.
  meta: ^1.19.0

  # Model code generation annotations; generators live in dev_dependencies.
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

dev_dependencies:
  # Only so repository tests can hand SupabaseClient a recording http client and
  # assert on the PostgREST requests it actually sends. Never imported by lib/.
  http: ^1.6.0
  flutter_test:
    sdk: flutter

  # Lint rules enforced by `flutter analyze`, which must be clean before a
  # sprint is considered done.
  flutter_lints: ^6.0.0

  # Code generation. Run: dart run build_runner build --delete-conflicting-outputs
  build_runner: ^2.16.0
  riverpod_generator: ^4.0.8
  freezed: ^4.0.0
  json_serializable: ^6.14.1

  # Generates the Android launcher icons from assets/images/paypaw_logo.png.
  # Run: dart run flutter_launcher_icons
  #
  # A dev dependency and a generator rather than hand-cut PNGs in five mipmap
  # buckets: the source of truth stays the one file a designer edits, and
  # regenerating is one command instead of five exports nobody remembers the
  # sizes for.
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  # Declared as individual files rather than the whole `assets/images/` directory,
  # so a file that is added but never referenced cannot silently grow the APK.
  assets:
    - assets/images/paypaw_logo.png
